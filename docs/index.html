<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff" id="tcolor">
<link rel="icon" href="icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--r:16px}
[data-theme="light"]{--bg:#f2f2f4;--panel:#ffffff;--panel2:#f7f7f8;--card:#ffffff;--txt:#111214;--mut:#8a8a93;--line:#e7e7ea;--chip:#efeff1;--btn:#111214;--btntxt:#ffffff;--shadow:0 10px 30px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#000000;--panel:#0d0d0f;--panel2:#141416;--card:#161618;--txt:#f5f5f6;--mut:#8e8e96;--line:#232326;--chip:#1c1c1f;--btn:#f5f5f6;--btntxt:#000000;--shadow:0 10px 30px rgba(0,0,0,.5)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.layout{display:flex;max-width:1200px;margin:0 auto;min-height:100vh}
/* ---- sidebar ---- */
.side{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;padding:6px 10px 16px}
.brand .mk{width:26px;height:26px;border-radius:50%;background:var(--txt);color:var(--bg);display:grid;place-items:center;font-size:14px}
.nbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--txt);font-size:14px;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left}
.nbtn .c{margin-left:auto;font-size:12px;color:var(--mut)}
.nbtn.on{background:var(--chip);font-weight:600}
.nbtn:hover{background:var(--chip)}
.slabel{font-size:11px;color:var(--mut);padding:12px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.side .foot{margin-top:auto;font-size:11px;color:var(--mut);padding:8px 10px}
/* ---- main ---- */
.main{flex:1;padding:22px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.top .sp{flex:1}
.icobtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:18px;cursor:pointer;display:grid;place-items:center}
.icobtn.solid{background:var(--btn);color:var(--btntxt);border-color:var(--btn)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;outline:none;color:var(--txt);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btntxt);border-color:var(--btn)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.card h3 time{font-size:11px;color:var(--mut);font-weight:400;white-space:nowrap}
.card .pv{font-size:13px;color:var(--mut);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card .pv label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.card .pv input{margin-top:3px;accent-color:var(--txt)}
.card .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--mut)}
.star{background:none;border:0;font-size:15px;cursor:pointer;color:var(--mut)}
.star.on{color:#e8a100}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--mut);grid-column:1/-1}
/* ---- editor ---- */
.editor{display:none;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);width:420px;flex-shrink:0;height:100vh;position:sticky;top:0}
.editor.open{display:flex}
.ed-head{display:flex;align-items:center;gap:8px;padding:16px;border-bottom:1px solid var(--line)}
.ed-head b{font-size:17px}
.ed-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ed-body input[type=text],.ed-body textarea,.ed-body select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;width:100%}
.ed-body textarea{min-height:220px;resize:vertical;line-height:1.6}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 11px;font-size:13px;cursor:pointer}
.aiBox{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:10px;font-size:13px}
.aiBox .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btntxt);border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--txt);border:1px solid var(--line)}
#aiOut{white-space:pre-wrap;margin-top:8px;display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;max-height:180px;overflow-y:auto}
.setcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.setcard h3{font-size:15px;margin-bottom:8px}
.setcard p{font-size:13px;color:var(--mut);line-height:1.6}
.setcard input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
/* ---- bottom nav / fab ---- */
.tabbar{display:none}
.fab{display:none}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btntxt);padding:10px 18px;border-radius:20px;font-size:13px;display:none;z-index:50}
@media(max-width:900px){
  .side{display:none}
  .cards{grid-template-columns:1fr 1fr}
  .editor{position:fixed;inset:0;width:100%;z-index:30;height:100dvh}
  .main{padding:16px 14px 110px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .tabbar button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabbar button.on{color:var(--txt);font-weight:700}
  .tabbar button span{font-size:19px}
  .fab{display:grid;position:fixed;right:16px;bottom:86px;width:54px;height:54px;border-radius:50%;background:var(--btn);color:var(--btntxt);font-size:26px;border:0;place-items:center;z-index:21;box-shadow:var(--shadow)}
}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><span class="mk">✦</span> Notes</div>
    <button class="nbtn" data-v="notes">📝 Заметки</button>
    <button class="nbtn" data-v="search">🔍 Поиск</button>
    <button class="nbtn" data-v="fav">☆ Избранное <span class="c" id="cFav"></span></button>
    <button class="nbtn" data-v="arch">📦 Архив <span class="c" id="cArch"></span></button>
    <div class="slabel">Категории</div>
    <button class="nbtn" data-c="">🗂 Все <span class="c" id="cAll"></span></button>
    <button class="nbtn" data-c="personal">👤 Личное <span class="c" id="cP"></span></button>
    <button class="nbtn" data-c="work">💼 Работа <span class="c" id="cW"></span></button>
    <button class="nbtn" data-c="ideas">💡 Идеи <span class="c" id="cI"></span></button>
    <div class="slabel">Вид</div>
    <button class="nbtn" data-v="set">⚙ Настройки</button>
    <button class="nbtn" id="themeBtn">◐ Тема: <span id="themeName"></span></button>
    <div class="foot">Good notes.<br>Better tomorrow.</div>
  </aside>

  <main class="main">
    <div class="top">
      <h1 id="viewTitle">Notes</h1><span class="sp"></span>
      <button class="icobtn" id="themeBtnM" title="Тема">◐</button>
      <button class="icobtn solid" id="newBtn" title="Новая">＋</button>
    </div>
    <div class="sub" id="viewSub">Small thoughts. Big plans.</div>
    <div id="searchWrap" class="search" style="display:none"><span>🔍</span><input id="q" placeholder="Search your notes..."></div>
    <div class="chips" id="chips">
      <button class="chip" data-c="">All</button>
      <button class="chip" data-c="personal">Personal</button>
      <button class="chip" data-c="work">Work</button>
      <button class="chip" data-c="ideas">Ideas</button>
    </div>
    <div id="content"></div>
  </main>

  <section class="editor" id="editor">
    <div class="ed-head"><button class="icobtn" id="backBtn">‹</button><b id="edTitle">New note</b><span class="sp" style="flex:1"></span><span id="edDate" style="font-size:11px;color:var(--mut)"></span></div>
    <div class="ed-body">
      <input type="text" id="fTitle" placeholder="Заголовок...">
      <select id="fCat"><option value="personal">👤 Личное</option><option value="work">💼 Работа</option><option value="ideas">💡 Идеи</option></select>
      <div class="tools">
        <button id="tH">T заголовок</button><button id="tList">• список</button><button id="tCheck">☐ задача</button><button id="tFav">☆ в избранное</button>
      </div>
      <textarea id="fBody" placeholder="Write something..."></textarea>
      <div class="aiBox">✦ <b>Спросить Gemini</b>
        <div class="row">
          <button class="btn ghost" data-ai="improve" style="font-size:12px;padding:8px">Улучшить</button>
          <button class="btn ghost" data-ai="summary" style="font-size:12px;padding:8px">Итог</button>
          <button class="btn ghost" data-ai="tasks" style="font-size:12px;padding:8px">Задачи</button>
        </div>
        <div class="row"><input id="aiQ" placeholder="Свой вопрос..." style="flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px;font-size:13px"><button class="btn" id="aiGo" style="padding:9px 14px">➤</button></div>
        <div id="aiOut"></div>
      </div>
      <button class="btn" id="saveBtn">Save</button>
      <div class="row" style="display:flex;gap:8px">
        <button class="btn ghost" id="archBtn" style="flex:1">📦 В архив</button>
        <button class="btn ghost" id="delBtn" style="flex:1;color:#e5484d">Удалить</button>
      </div>
    </div>
  </section>
</div>

<button class="fab" id="fab">＋</button>
<nav class="tabbar">
  <button data-v="notes" class="on"><span>⌂</span>Home</button>
  <button data-v="notes2"><span>▤</span>Notes</button>
  <button data-v="search"><span>🔍</span>Search</button>
  <button data-v="set"><span>👤</span>Profile</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const CATS={personal:'Личное',work:'Работа',ideas:'Идеи'};
let notes=[],view='notes',cat='',q='',editId=null;
try{notes=JSON.parse(localStorage.getItem('notes2')||'[]')}catch(e){notes=[]}
if(!localStorage.getItem('notes2_seeded')){
  notes=[
    {id:1,title:'Project ideas',body:'- Build a productivity app\n- Improve UI/UX design\n- Explore AI tools for content creation',cat:'work',fav:true,arch:false,ts:Date.now()-36e5},
    {id:2,title:'Daily plan',body:'- [ ] Work on the presentation\n- [ ] Gym at 6 PM\n- [ ] Read before bed',cat:'personal',fav:false,arch:false,ts:Date.now()-72e5},
    {id:3,title:'Random thoughts',body:'Maybe I should start a blog...\nOr learn a new language? 🙂',cat:'ideas',fav:false,arch:false,ts:Date.now()-864e5},
    {id:4,title:'Books to read',body:'- Atomic Habits\n- Deep Work\n- The Psychology of Money',cat:'personal',fav:false,arch:false,ts:Date.now()-864e5}
  ];
  localStorage.setItem('notes2_seeded','1');persist();
}
function persist(){localStorage.setItem('notes2',JSON.stringify(notes))}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function fmt(ts){const d=new Date(ts),now=new Date();const sameDay=d.toDateString()===now.toDateString();
  const y=new Date(now-864e5).toDateString()===d.toDateString();
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(sameDay)return 'Today, '+hm;if(y)return 'Yesterday';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
/* theme */
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('themeName').textContent=t==='light'?'светлая':'тёмная';$('tcolor').content=t==='light'?'#ffffff':'#000000'}
setTheme(localStorage.getItem('theme')||'light');
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
$('themeBtnM').onclick=$('themeBtn').onclick;
/* nav */
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;
  if(v==='notes2')v='notes';
  view=v;$('searchWrap').style.display=v==='search'?'flex':'none';
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x===b||(v==='notes'&&x.dataset.v==='notes')));
  document.querySelectorAll('.side .nbtn').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  render();if(v==='search')$('q').focus();});
document.querySelectorAll('[data-c]').forEach(b=>{if(b.classList.contains('chip')||b.classList.contains('nbtn'))b.onclick=()=>{cat=b.dataset.c;render()}});
$('q').oninput=e=>{q=e.target.value.toLowerCase();render()};
/* list */
function counts(){const a=notes.filter(n=>!n.arch);return{all:a.length,p:a.filter(n=>n.cat==='personal').length,w:a.filter(n=>n.cat==='work').length,i:a.filter(n=>n.cat==='ideas').length,f:notes.filter(n=>n.fav&&!n.arch).length,ar:notes.filter(n=>n.arch).length}}
function pvHTML(n){
  return n.body.split('\n').slice(0,5).map(L=>{
    const m=L.match(/^-\s*\[( |x)\]\s*(.*)/);
    if(m)return `<label><input type="checkbox" ${m[1]==='x'?'checked':''} data-task="${n.id}::${esc(L)}"> <span>${esc(m[2])}</span></label>`;
    if(L.startsWith('- '))return '• '+esc(L.slice(2));
    return esc(L);
  }).join('<br>')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  const c=counts();$('cAll').textContent=c.all;$('cP').textContent=c.p;$('cW').textContent=c.w;$('cI').textContent=c.i;$('cFav').textContent=c.f;$('cArch').textContent=c.ar;
  document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.c===cat));
  const box=$('content');
  if(view==='set'){box.innerHTML='';$('viewTitle').textContent='Settings';$('viewSub').textContent='App preferences.';
    const d=document.createElement('div');
    d.innerHTML=`<div class="setcard"><h3>🔑 Gemini API-ключ</h3><p>Нужен для кнопок ИИ. Хранится только в телефоне.<br>Где взять: aistudio.google.com → Create API key</p><input id="k" type="password" placeholder="AIza..."></div>
    <div class="setcard"><h3>◐ Тема</h3><p>Сейчас: <b>${document.documentElement.dataset.theme==='light'?'светлая':'тёмная'}</b></p><div style="height:8px"></div><button class="btn ghost" id="sw">Переключить тему</button></div>
    <div class="setcard"><h3>📦 Данные</h3><p>Заметок: ${notes.length}</p><div style="height:8px"></div><button class="btn ghost" id="exp">Скачать копию (JSON)</button></div>`;
    box.appendChild(d);
    d.querySelector('#k').value=localStorage.getItem('gemini-key')||'';
    d.querySelector('#k').onchange=e=>{localStorage.setItem('gemini-key',e.target.value.trim());toast('Ключ сохранён')};
    d.querySelector('#sw').onclick=$('themeBtn').onclick;
    d.querySelector('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='notes.json';a.click()};
    return}
  $('viewTitle').textContent=view==='search'?'Search':view==='fav'?'Favorites':view==='arch'?'Archive':'Notes';
  $('viewSub').textContent=view==='search'?'Find anything.':view==='fav'?'Starred notes.':view==='arch'?'Archived notes.':'Small thoughts. Big plans.';
  let list=notes.filter(n=>view==='arch'?n.arch:!n.arch);
  if(view==='fav')list=list.filter(n=>n.fav);
  if(cat)list=list.filter(n=>n.cat===cat);
  if(q)list=list.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));
  list=list.slice().sort((a,b)=>b.ts-a.ts);
  box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="empty">No notes here yet.<br>Tap ＋ to create one.</div>';return}
  list.forEach(n=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<h3><span></span><time>${fmt(n.ts)}</time></h3><div class="pv">${pvHTML(n)}</div><div class="ft"><span>${CATS[n.cat]||''}</span><button class="star ${n.fav?'on':''}">${n.fav?'★':'☆'}</button></div>`;
    d.querySelector('h3 span').textContent=n.title;
    d.querySelector('.star').onclick=e=>{e.stopPropagation();n.fav=!n.fav;n.ts=Date.now();persist();render()};
    d.onclick=e=>{if(e.target.type==='checkbox')return;openEd(n.id)};
    box.appendChild(d);
  });
  box.querySelectorAll('[data-task]').forEach(cb=>cb.onchange=()=>{
    const[id,line]=cb.dataset.task.split('::');const n=notes.find(x=>x.id==id);if(!n)return;
    n.body=n.body.split('\n').map(L=>L===line?L.replace('[ ]','[x]').replace('[x]','[ ]'):L).join('\n');
    n.ts=Date.now();persist();render()});
}
/* editor */
function openEd(id){editId=id;const n=notes.find(x=>x.id===id);
  $('edTitle').textContent=n?'Edit note':'New note';
  $('edDate').textContent=n?fmt(n.ts):'';
  $('fTitle').value=n?n.title:'';$('fBody').value=n?n.body:'';$('fCat').value=n?n.cat:'personal';
  $('archBtn').textContent=n&&n.arch?'📤 Из архива':'📦 В архив';
  $('editor').classList.add('open');$('aiOut').style.display='none'}
function closeEd(){$('editor').classList.remove('open');editId=null}
$('backBtn').onclick=closeEd;
$('newBtn').onclick=()=>openEd(null);$('fab').onclick=()=>openEd(null);
function ins(t){const b=$('fBody');const s=b.selectionStart||b.value.length;b.value=b.value.slice(0,s)+t+b.value.slice(b.selectionEnd||s);b.focus()}
$('tH').onclick=()=>ins('\n## ');$('tList').onclick=()=>ins('\n- ');$('tCheck').onclick=()=>ins('\n- [ ] ');
$('tFav').onclick=()=>toast('Поставь ★ после сохранения в списке');
$('saveBtn').onclick=()=>{
  const t=$('fTitle').value.trim(),b=$('fBody').value.trim();
  if(!t&&!b)return toast('Пустую заметку не сохраняю');
  if(editId){const n=notes.find(x=>x.id===editId);Object.assign(n,{title:t||'Без заголовка',body:b,cat:$('fCat').value,ts:Date.now()})}
  else notes.unshift({id:Date.now(),title:t||'Без заголовка',body:b,cat:$('fCat').value,fav:false,arch:false,ts:Date.now()});
  persist();render();closeEd();toast('Saved ✓')};
$('delBtn').onclick=()=>{if(!editId)return closeEd();if(confirm('Удалить заметку?')){notes=notes.filter(x=>x.id!==editId);persist();render();closeEd()}};
$('archBtn').onclick=()=>{if(!editId)return closeEd();const n=notes.find(x=>x.id===editId);n.arch=!n.arch;persist();render();closeEd();toast(n.arch?'В архиве':'Возвращена')};
/* AI */
async function gemini(prompt){
  const key=localStorage.getItem('gemini-key')||'';
  if(!key){toast('Вставь API-ключ в Настройках');return null}
  const o=$('aiOut');o.style.display='block';o.textContent='⏳ Gemini думает...';
  try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const j=await r.json();if(j.error)throw new Error(j.error.message);
    o.textContent=j.candidates?.[0]?.content?.parts?.[0]?.text||'(пусто)';return o.textContent;
  }catch(e){o.textContent='❌ '+e.message;return null}}
document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{
  const n=notes.find(x=>x.id===editId);const ctx=n?`Заголовок: ${n.title}\nТекст: ${n.body}`:'(заметка пустая, отвечай общо)';
  const m={improve:`Улучши заметку, по-русски:\n${ctx}`,summary:`Суммаризируй в 3 пунктах, по-русски:\n${ctx}`,tasks:`Преврати в чек-лист задач "- [ ] ...", по-русски:\n${ctx}`};
  gemini(m[b.dataset.ai])});
$('aiGo').onclick=()=>{const v=$('aiQ').value.trim();if(!v)return;const n=notes.find(x=>x.id===editId);gemini(`Контекст: ${n?n.title+'\n'+n.body:'(нет)'}\nВопрос: ${v}\nОтвечай по-русски, коротко.`)};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
